plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// The bundled SQLite driver's Android artifact only ships Android .so files. For JVM unit tests, the matching
// native library for this machine is taken from the driver's JVM artifact and placed on java.library.path.
configurations {
    sqliteHostNatives { transitive = false }
}
def sqliteHostNativesDir = layout.buildDirectory.dir('sqlite-host-natives')
def sqliteHostPlatform = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def archName = (arch.contains('aarch64') || arch.contains('arm64')) ? 'arm64' : 'x64'
    os.contains('mac') ? "osx_${archName}" : os.contains('win') ? 'windows_x64' : "linux_${archName}"
}()
tasks.register('extractSqliteHostNatives', Copy) {
    from(zipTree(configurations.sqliteHostNatives.singleFile)) {
        include "natives/${sqliteHostPlatform}/*"
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into sqliteHostNativesDir
}

android {
    namespace 'com.nagabhushansn95.financetracker'
    compileSdk 37

    defaultConfig {
        applicationId "com.nagabhushansn95.financetracker"
        minSdk 26
        // targetSdk is raised to 36 before the 5.0.0 release (see plan, section 0b).
        targetSdk 33
        versionCode 145
        versionName "5.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all { test ->
                // Robolectric tests run the bundled SQLite driver with the host build of its native library.
                test.dependsOn('extractSqliteHostNatives')
                test.systemProperty 'java.library.path', sqliteHostNativesDir.get().asFile.absolutePath
            }
        }
    }
}


ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.generateKotlin", "true")
}

dependencies {
    // Kotlin / coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // AndroidX core
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    // Google sign-in / authorization for the Drive backup upload (Drive itself is called over REST)
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.activity:activity-compose:1.13.0'
    // Device-credential prompt (fingerprint / pattern) before the investments are shown
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    // Drag-handle reordering for Edit Data lists
    implementation 'sh.calvin.reorderable:reorderable:3.1.0'

    // Room
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    // Bundled SQLite (same engine on every Android version, prepared statements reused across rows; the
    // framework-SQLite compatibility path re-prepares per row and was ~8x slower on bulk inserts).
    implementation 'androidx.sqlite:sqlite-bundled:2.6.2'

    // Unit tests run on the JVM against copies of the real v4 database
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.room:room-testing:2.8.5'
    sqliteHostNatives 'androidx.sqlite:sqlite-bundled-jvm:2.6.2'
}
